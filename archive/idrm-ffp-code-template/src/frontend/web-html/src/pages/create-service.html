<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request help — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <!-- Leaflet from jsdelivr (matches the gateway CSP); a regular script so `L` is
         global before the deferred module runs. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header id="app-header" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto w-full max-w-2xl flex-1 px-4 py-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Request help</h1>
      <p class="mt-1 text-sm text-slate-500">Tell us what you need and where. Emergencies are auto-approved.</p>

      <p id="form-error" class="mt-4 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 ring-1 ring-red-500/40" role="alert"></p>

      <form id="create-form" class="mt-6 space-y-5" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="service_type" class="block text-sm font-medium text-slate-700">Type of help</label>
            <select id="service_type" name="service_type" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30">
              <option value="RESCUE">Rescue</option>
              <option value="MEDICAL">Medical</option>
              <option value="FOOD">Food</option>
              <option value="WATER">Water</option>
              <option value="SHELTER">Shelter</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div>
            <label for="priority" class="block text-sm font-medium text-slate-700">Priority</label>
            <select id="priority" name="priority" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30">
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-slate-700">What's the situation?</label>
          <textarea id="description" name="description" rows="3" required minlength="10" maxlength="500"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"></textarea>
          <p class="mt-1 text-xs text-slate-500">10–500 characters.</p>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label class="block text-sm font-medium text-slate-700">Location</label>
            <button type="button" id="locate-btn" class="text-xs font-medium text-emerald-600 hover:underline">Use my location</button>
          </div>
          <div id="map" class="mt-1 h-64 w-full overflow-hidden rounded-xl border border-slate-200"></div>
          <p id="coords" class="mt-1 text-xs text-slate-500">Tap the map to drop a pin.</p>
        </div>

        <div>
          <label for="address" class="block text-sm font-medium text-slate-700">Address <span class="font-normal text-slate-400">(optional)</span></label>
          <input id="address" name="address" type="text"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="num_people_affected" class="block text-sm font-medium text-slate-700">People affected</label>
            <input id="num_people_affected" name="num_people_affected" type="number" min="1" max="1000" value="1"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30" />
          </div>
          <div>
            <label for="contact_phone" class="block text-sm font-medium text-slate-700">Contact phone</label>
            <input id="contact_phone" name="contact_phone" type="tel" placeholder="+919876543210"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30" />
          </div>
        </div>

        <fieldset>
          <legend class="block text-sm font-medium text-slate-700">Who can see your identity?</legend>
          <div class="mt-2 space-y-1 text-sm">
            <label class="flex items-center gap-2"><input type="radio" name="privacy_level" value="PUBLIC" class="text-emerald-600" /> Public — name visible to everyone</label>
            <label class="flex items-center gap-2"><input type="radio" name="privacy_level" value="PROTECTED" checked class="text-emerald-600" /> Protected — hidden from the public (recommended)</label>
            <label class="flex items-center gap-2"><input type="radio" name="privacy_level" value="PRIVATE" class="text-emerald-600" /> Private — only you, the provider, and admins</label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:opacity-60">
          Submit request
        </button>
      </form>
    </main>

    <script type="module" src="/src/js/create-service.js"></script>
  </body>
</html>
