<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header id="app-header" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto w-full max-w-md flex-1 px-4 py-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Profile</h1>

      <div class="mt-4 rounded-xl border border-slate-200 bg-white p-4 text-sm">
        <div class="flex justify-between"><span class="text-slate-500">Email</span><span id="email" class="font-medium text-slate-900">…</span></div>
        <div class="mt-2 flex justify-between"><span class="text-slate-500">Role</span><span id="role" class="font-medium text-slate-900">…</span></div>
      </div>

      <p id="form-msg" class="mt-4 hidden" role="status"></p>

      <form id="profile-form" class="mt-4 space-y-4" novalidate>
        <div>
          <label for="full_name" class="block text-sm font-medium text-slate-700">Full name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required minlength="2"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30" />
        </div>
        <div>
          <label for="phone" class="block text-sm font-medium text-slate-700">Phone <span class="font-normal text-slate-400">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+919876543210"
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30" />
        </div>
        <div>
          <label for="language" class="block text-sm font-medium text-slate-700">Language</label>
          <select id="language" name="language"
            class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30">
            <option value="en">English</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="te">తెలుగు (Telugu)</option>
          </select>
        </div>
        <button id="save-btn" type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:opacity-60">
          Save changes
        </button>
      </form>
    </main>

    <script type="module" src="/src/js/profile.js"></script>
  </body>
</html>
