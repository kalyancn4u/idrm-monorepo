<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-4">
        <a href="/" class="text-lg font-extrabold tracking-tight text-slate-900">IDRM</a>
      </div>
    </header>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>
        <p class="mt-1 text-sm text-slate-500">Welcome back — access your requests and the live map.</p>

        <!-- Error message (filled by auth-login.js) -->
        <p id="form-error" class="mt-4 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 ring-1 ring-red-500/40" role="alert"></p>

        <form id="login-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
            <input
              id="email" name="email" type="email" autocomplete="email" required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>
          <div>
            <div class="flex items-center justify-between">
              <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
              <a href="/src/pages/forgot-password.html" class="text-xs text-emerald-600 hover:underline">Forgot password?</a>
            </div>
            <input
              id="password" name="password" type="password" autocomplete="current-password" required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>
          <button
            id="submit-btn" type="submit"
            class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:opacity-60"
          >
            Sign in
          </button>
        </form>

        <!-- Phone + OTP quick-start (planned — the backend OTP endpoint isn't built yet). -->
        <div class="my-6 flex items-center gap-3 text-xs text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span>OR<span class="h-px flex-1 bg-slate-200"></span>
        </div>
        <button
          type="button" disabled title="Coming soon"
          class="w-full cursor-not-allowed rounded-lg border border-slate-300 bg-slate-50 px-4 py-2.5 font-semibold text-slate-400"
        >
          Continue with phone (OTP) — coming soon
        </button>

        <p class="mt-6 text-center text-sm text-slate-500">
          New to IDRM?
          <a href="/src/pages/register.html" class="font-medium text-emerald-600 hover:underline">Create an account</a>
        </p>
      </div>
    </main>

    <script type="module" src="/src/js/auth-login.js"></script>
  </body>
</html>
