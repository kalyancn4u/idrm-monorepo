<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live map — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header id="app-header" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Live map</h1>
        <div class="flex items-center gap-3">
          <label for="type-filter" class="sr-only">Filter by service type</label>
          <select id="type-filter" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30">
            <option value="">All types</option>
            <option value="RESCUE">Rescue</option>
            <option value="MEDICAL">Medical</option>
            <option value="FOOD">Food</option>
            <option value="WATER">Water</option>
            <option value="SHELTER">Shelter</option>
            <option value="OTHER">Other</option>
          </select>
          <a href="/src/pages/create-service.html" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Request help</a>
        </div>
      </div>

      <!-- Legend: marker colour = priority (FS map convention) -->
      <div class="mt-3 flex flex-wrap items-center gap-4 text-xs text-slate-500">
        <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-full" style="background:#ef4444"></span> Critical</span>
        <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-full" style="background:#f97316"></span> High</span>
        <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-full" style="background:#f59e0b"></span> Medium</span>
        <span class="flex items-center gap-1"><span class="inline-block h-3 w-3 rounded-full" style="background:#10b981"></span> Low</span>
        <span id="map-status" class="ml-auto"></span>
      </div>

      <div id="map" class="mt-3 h-[72vh] w-full overflow-hidden rounded-xl border border-slate-200"></div>
    </main>

    <script type="module" src="/src/js/map-view.js"></script>
  </body>
</html>
