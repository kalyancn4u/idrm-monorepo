<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-4">
        <a href="/" class="text-lg font-extrabold tracking-tight text-slate-900">IDRM</a>
      </div>
    </header>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
        <p class="mt-1 text-sm text-slate-500">Request help, or register as a service provider.</p>

        <!-- Error message (filled by auth-register.js) -->
        <p id="form-error" class="mt-4 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 ring-1 ring-red-500/40" role="alert"></p>

        <form id="register-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label for="full_name" class="block text-sm font-medium text-slate-700">Full name</label>
            <input
              id="full_name" name="full_name" type="text" autocomplete="name" required minlength="2"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
            <input
              id="email" name="email" type="email" autocomplete="email" required
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium text-slate-700">
              Phone <span class="font-normal text-slate-400">(optional)</span>
            </label>
            <input
              id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+919876543210"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
            <input
              id="password" name="password" type="password" autocomplete="new-password" required minlength="8"
              class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
            />
            <p class="mt-1 text-xs text-slate-500">At least 8 characters.</p>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="role" class="block text-sm font-medium text-slate-700">I am a…</label>
              <select
                id="role" name="role"
                class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              >
                <option value="CITIZEN">Citizen (need help)</option>
                <option value="PROVIDER">Provider (NGO / hospital)</option>
                <option value="VOLUNTEER">Volunteer</option>
              </select>
            </div>
            <div>
              <label for="language_preference" class="block text-sm font-medium text-slate-700">Language</label>
              <select
                id="language_preference" name="language_preference"
                class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              >
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
              </select>
            </div>
          </div>
          <button
            id="submit-btn" type="submit"
            class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:opacity-60"
          >
            Create account
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-500">
          Already have an account?
          <a href="/src/pages/login.html" class="font-medium text-emerald-600 hover:underline">Sign in</a>
        </p>
      </div>
    </main>

    <script type="module" src="/src/js/auth-register.js"></script>
  </body>
</html>
