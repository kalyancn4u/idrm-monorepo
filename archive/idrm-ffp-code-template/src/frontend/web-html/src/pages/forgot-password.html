<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password — IDRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="font-sans antialiased bg-slate-50 text-slate-700 min-h-screen flex flex-col">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-4">
        <a href="/" class="text-lg font-extrabold tracking-tight text-slate-900">IDRM</a>
      </div>
    </header>

    <main class="flex flex-1 items-center justify-center px-4 py-12">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">Reset your password</h1>
        <!--
          Self-service reset is intentionally a placeholder: the backend has no
          /auth/forgot-password or /auth/reset-password endpoint yet (not in the
          MVP API). Wire this form up when those endpoints exist.
        -->
        <p class="mt-3 text-sm leading-relaxed text-slate-600">
          Self-service password reset is <strong>coming soon</strong>. If you're locked out, please
          contact your local disaster-management coordinator or IDRM support to regain access.
        </p>
        <a
          href="/src/pages/login.html"
          class="mt-6 inline-block rounded-lg bg-emerald-600 px-5 py-2.5 font-semibold text-white hover:bg-emerald-700"
        >
          Back to sign in
        </a>
      </div>
    </main>
  </body>
</html>
